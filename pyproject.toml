[project]
name = "support-metrics"
version = "0.1.0"
description = "Local-first support metrics system pulling from HubSpot into SQLite"
requires-python = ">=3.10"
dependencies = [
    "hubspot-api-client>=11.0.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "python-dotenv>=1.0.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sync*", "reports*"]
